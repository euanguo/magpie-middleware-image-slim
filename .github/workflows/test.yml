name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: test
        # the cases refuse a real home: no real sign-in is ever read
        run: HOME=$(mktemp -d) bun test
